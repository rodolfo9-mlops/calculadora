
name: Integral Dev Testing

on:
  pull_request:
    branches:
      - dev

jobs:
  tests:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-qa.txt

      - name: Run pytest (fail on any error)
        run: pytest tests/integral/test_calculator.py

  flake8:
    name: Flake8 style check (non-blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 (do NOT fail PR)
        run: |
          flake8 calculator || true